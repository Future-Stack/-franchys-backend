version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: francys-api:latest
    container_name: francys_api
    restart: always
    ports:
      - "3001:3000"
    environment:
      # Database connection via the docker-compose postgres service
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - francys_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: francys_postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-mydb}
    # Mount volume for database persistence
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mydb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - francys_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    name: francys_postgres_data

networks:
  francys_network:
    name: francys_network
    driver: bridge
